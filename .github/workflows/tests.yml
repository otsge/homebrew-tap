name: CI

on:
  pull_request:
    paths:
      - 'Formula/**'

env:
  BOTTLES_DIR: ${{ github.workspace }}/bottles
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_ENFORCE_SBOM: 1
  GH_REPO: ${{ github.repository }}
  GH_NO_UPDATE_NOTIFIER: 1
  GH_PROMPT_DISABLED: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed_files:
    if: always()
    outputs:
      all-changed-files: ${{ steps.changed-files.outputs.all_changed_files }}
      added-files: ${{ steps.changed-files.outputs.added_files }}
      modified-files: ${{ steps.changed-files.outputs.modified_files }}
      added-files-count: ${{ steps.changed-files.outputs.added_files_count }}
      modified-files-count: ${{ steps.changed-files.outputs.modified_files_count }}
      curl-files: ${{ steps.file-deps.outputs.curl }}
      fuse-files: ${{ steps.file-deps.outputs.fuse }}
      no-linux: ${{ steps.file-deps.outputs.no_linux }}
      openssl4-files: ${{ steps.file-deps.outputs.openssl4 }}
      xcode26-files: ${{ steps.file-deps.outputs.xcode26 }}
    runs-on: ubuntu-latest
    name: Test changed-files
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@main
        with:
          files: Formula/**

      - name: List all changed files
        id: file-deps
        continue-on-error: true
        if: ${{ steps.changed-files.outputs.added_files_count > 0 || steps.changed-files.outputs.modified_files_count > 0 }}
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.added_files }} ${{ steps.changed-files.outputs.modified_files }}
        run: |
          echo "${ALL_CHANGED_FILES}"
          for file in ${ALL_CHANGED_FILES}; do
            grep -qls 'fuse' "$file" && echo "fuse=True" >> "${GITHUB_OUTPUT}" || true
            grep -qls 'xcode: \["26.0"' "$file" && echo "xcode26=True" >> "${GITHUB_OUTPUT}" || true
            grep -qls 'class Curl' "$file" && echo "curl=True" >> "${GITHUB_OUTPUT}" || true
            grep -qls 'depends_on.*openssl@4' "$file" && echo "openssl4=True" >> "${GITHUB_OUTPUT}" || true
            grep -qls 'depends_on :macos' "$file" || echo "no_linux=False" >> "${GITHUB_OUTPUT}"
          done

  test-bot-mac:
    needs: changed_files
    if: ${{ github.event_name == 'pull_request' && (needs.changed_files.outputs.added-files-count > 0 || needs.changed_files.outputs.modified-files-count > 0) }}
    continue-on-error: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast-syntax') }}
    strategy:
      matrix:
        os: [ macos-15, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      packages: read
      pull-requests: read
      statuses: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true
          cask: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup runner
        run: brew test-bot --only-cleanup-before

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@main
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Setup Homebrew test environment
        run: |
          printf '\n<details><summary>brew test-bot --only-setup</summary>\n<p>\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "${GITHUB_STEP_SUMMARY}"
          HOMEBREW_NO_COLOR=1 brew test-bot --only-setup | tee -a "${GITHUB_STEP_SUMMARY}"
          printf '```\n' >> "${GITHUB_STEP_SUMMARY}"
          printf '\n</p>\n</details>\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Tap syntax check
        run: brew test-bot --only-tap-syntax

      - name: Install FUSE-T
        if: ${{ needs.changed_files.outputs.fuse-files == 'True' }}
        run: |
          brew install --verbose --cask fuse-t
          brew trust otsge/keg
          brew tap otsge/keg
          pushd "$(brew --repo otsge/keg)"
          sudo cmd/brew-fuse-t-links-add
          popd
          brew untap homebrew/cask

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - name: Set up bottles directory
        id: setup-bottles
        if: github.event_name == 'pull_request'
        run: |
          rm -rvf "${BOTTLES_DIR:?}"
          mkdir "${BOTTLES_DIR:?}"

          bottle_specifier="{${MACOS_VERSION},${MACOS_VERSION}-${{ runner.arch }}}"

          echo "bottle_specifier=$bottle_specifier" >> "$GITHUB_OUTPUT"
        env:
          MACOS_VERSION: ${{ matrix.os }}

      - name: Build bottle for ${{ matrix.os }}
        id: build-bottle
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.BOTTLES_DIR }}
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}
          IS_CURL: ${{ (needs.changed_files.outputs.curl-files && 'TRUE') || 'FALSE' }}
          OPENSSL_4: ${{ (needs.changed_files.outputs.openssl4-files && 'TRUE') || 'FALSE' }}
          XCODE_26: ${{ (needs.changed_files.outputs.xcode26-files && 'TRUE') || 'FALSE' }}
        run:  |
          brew trust otsge/draft
          brew tap otsge/draft
          if [[ "${OPENSSL_4}" == "TRUE" ]]
          then
            export HOMEBREW_NO_INSTALL_FROM_API=1
            sed -i '' 's#depends_on "libssh2"#depends_on "otsge/draft/libssh2"#g' "$(brew --repository homebrew/core)"/Formula/*/*.rb
            sed -i '' 's#depends_on "libngtcp2"#depends_on "otsge/draft/libngtcp2"#g' "$(brew --repository homebrew/core)"/Formula/*/*.rb
          fi
          if [[ "${XCODE_26}" == "TRUE" && ${{ matrix.os }} == "macos-15" ]]
          then
            brew install xcodes
            xcodes install --latest --select
          fi
          brew test-bot --only-formulae --skip-online-checks --skip-dependents --root-url=https://ghcr.io/v2/otsge/tap

      - name: Post-build steps
        id: upload-bottles
        if: always() && github.event_name == 'pull_request'
        uses: Homebrew/actions/post-build@main
        with:
          runner: ${{ matrix.os }}
          bottles-directory: ${{ env.BOTTLES_DIR }}
          logs-directory: ${{ env.BOTTLES_DIR }}/logs

  test-bot-linux:
    needs: changed_files
    if: ${{ github.event_name == 'pull_request' && needs.changed_files.outputs.no-linux == 'False' && (needs.changed_files.outputs.added-files-count > 0 || needs.changed_files.outputs.modified-files-count > 0) }}
    continue-on-error: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast-syntax') }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/ubuntu24.04:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/ubuntu24.04:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      packages: read
      pull-requests: read
      statuses: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true
          cask: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup runner
        run: brew test-bot --only-cleanup-before

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@main
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Setup Homebrew test environment
        run: |
          printf '\n<details><summary>brew test-bot --only-setup</summary>\n<p>\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "${GITHUB_STEP_SUMMARY}"
          HOMEBREW_NO_COLOR=1 brew test-bot --only-setup | tee -a "${GITHUB_STEP_SUMMARY}"
          printf '```\n' >> "${GITHUB_STEP_SUMMARY}"
          printf '\n</p>\n</details>\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Tap syntax check
        run: brew test-bot --only-tap-syntax

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - name: Set up bottles directory
        id: setup-bottles
        if: github.event_name == 'pull_request'
        run: |
          rm -rvf "${BOTTLES_DIR:?}"
          mkdir "${BOTTLES_DIR:?}"

          bottle_specifier="{${{ matrix.os }},linux-${ARCH}}"

          echo "bottle_specifier=$bottle_specifier" >> "$GITHUB_OUTPUT"
        env:
          ARCH: ${{ runner.arch }}

      - name: Build bottle for ${{ matrix.os }}
        id: build-bottle
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.BOTTLES_DIR }}
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}
          IS_CURL: ${{ (needs.changed_files.outputs.curl-files && 'TRUE') || 'FALSE' }}
          OPENSSL_4: ${{ (needs.changed_files.outputs.openssl4-files && 'TRUE') || 'FALSE' }}
        run:  |
          brew trust otsge/draft
          brew tap otsge/draft
          if [[ "${IS_CURL}" == "TRUE" ]]
          then
            export HOMEBREW_NO_INSTALL_FROM_API=1
            sed -i 's!uses_from_macos "curl"!# uses_from_macos "curl"!g' "$(brew --repository homebrew/core)"/Formula/r/rust.rb
          fi
          if [[ "${OPENSSL_4}" == "TRUE" ]]
          then
            export HOMEBREW_NO_INSTALL_FROM_API=1
            sed -i 's#depends_on "libssh2"#depends_on "otsge/draft/libssh2"#g' "$(brew --repository homebrew/core)"/Formula/*/*.rb
            sed -i 's#depends_on "libngtcp2"#depends_on "otsge/draft/libngtcp2"#g' "$(brew --repository homebrew/core)"/Formula/*/*.rb
          fi
          brew test-bot --only-formulae --skip-online-checks --skip-dependents --root-url=https://ghcr.io/v2/otsge/tap

      - name: Post-build steps
        id: upload-bottles
        if: github.event_name == 'pull_request'
        uses: Homebrew/actions/post-build@main
        with:
          runner: ${{ matrix.os }}
          bottles-directory: ${{ env.BOTTLES_DIR }}
          logs-directory: ${{ env.BOTTLES_DIR }}/logs

  label-pr-both:
    needs: [changed_files, test-bot-mac, test-bot-linux]
    if: ${{ github.event_name == 'pull_request' && needs.changed_files.outputs.no-linux == 'False' }}
    runs-on: ubuntu-slim
    steps:
      - name: Label the Pull Request
        id: label-the-pr
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "${PR_NUMBER}" --add-label "pr-pull" --repo "${GITHUB_REPOSITORY}"

  label-pr-mac:
    needs: [changed_files, test-bot-mac]
    if: ${{ github.event_name == 'pull_request' && needs.changed_files.outputs.no-linux != 'False' }}
    runs-on: ubuntu-slim
    steps:
      - name: Label the Pull Request
        id: label-the-pr
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "${PR_NUMBER}" --add-label "pr-pull" --repo "${GITHUB_REPOSITORY}"
