name: Populate gem cache

on:
  pull_request:
    paths:
      - .github/workflows/cache.yml
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/cache.yml
  schedule:
    - cron: '30 19/6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: cache-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cache:
    strategy:
      matrix:
        os: [ macos-15, macos-26 ]
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/ubuntu24.04:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/ubuntu24.04:main
              options: --privileged
      fail-fast: false
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - name: Cleanup runner
        working-directory: ${{ runner.temp }}
        run: brew test-bot --only-cleanup-before

      - name: Cache Homebrew Bundler gems
        uses: actions/cache@main
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Setup Homebrew test environment
        working-directory: ${{ runner.temp }}
        run: brew test-bot --only-setup
